<section class="editor-card" id="summary" data-section="summary">

    <div class="card-header">

        <div class="drag-handle">

            <i data-lucide="grip-vertical"></i>

        </div>

        <div class="card-title">

            <h2>Professional Summary</h2>

            <p>
                Write a concise summary highlighting your skills, education, and career goals.
            </p>

        </div>

        <div class="card-actions">

            <button type="button" class="collapse-btn" data-section="summary">

                <i data-lucide="chevron-up"></i>

            </button>

        </div>

    </div>

    <div class="card-content">

        <textarea class="resume-input" data-section="summary" rows="7" maxlength="600"
            placeholder="Example:

Motivated Computer Science graduate with strong knowledge of Python, Flask, HTML, CSS and JavaScript. Passionate about building scalable web applications and continuously learning modern technologies. Seeking an entry-level software development opportunity where I can contribute while growing as a developer.">
        </textarea>

    </div>

</section>
