<section class="editor-card" id="education" data-section="education">

    <div class="card-header">

        <div class="drag-handle">

            <i data-lucide="grip-vertical"></i>

        </div>

        <div class="card-title">

            <i data-lucide="graduation-cap"></i>

            <div class="section-title-copy">
                <h2>Education</h2>
                <p>Add your educational qualifications. Add multiple education entries.</p>
            </div>

        </div>

        <div class="card-actions">

            <button type="button" id="addEducationBtn" class="primary-btn">

                <i data-lucide="plus"></i>

                Add Education

            </button>

            <button type="button" class="collapse-btn" data-section="education">

                <i data-lucide="chevron-up"></i>

            </button>

        </div>

    </div>

    <div class="card-content">

        <div id="educationContainer">

            <!-- Education cards are rendered by education.js -->

        </div>

    </div>

</section>
